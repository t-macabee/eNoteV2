name: enote_mobile
description: eNoteV2 student mobile client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  enote_core:
    path: ../enote_core
  provider: ^6.1.5
  http: ^1.6.0
  file_picker: ^10.3.10
  flutter_secure_storage: ^10.3.2
  flutter_stripe: ^14.0.0
  signalr_netcore: ^1.4.4
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
