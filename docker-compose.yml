name: enote

# Values that differ inside Docker: containers reach other services by service name.
# Everything else comes from .env through env_file.
x-docker-overrides: &docker-overrides
  ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=150057;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
  RabbitMQ__Host: rabbitmq
  Smtp__Host: mailhog

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: enote-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (min 8 chars, upper, lower, number, symbol)}
    # Local development only. Change MSSQL_SA_PASSWORD if SQLSERVER_PORT is ever published beyond the host.
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - enote-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: enote-rabbit
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: enote-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: ./eNote
      dockerfile: Dockerfile
      target: api
    container_name: enote-api
    env_file: .env
    environment:
      <<: *docker-overrides
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${API_PORT:-5059}:8080"
    volumes:
      - enote-uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  worker:
    build:
      context: ./eNote
      dockerfile: Dockerfile
      target: worker
    container_name: enote-worker
    env_file: .env
    environment:
      <<: *docker-overrides
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/enote-worker-healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  enote-sql-data:
  enote-uploads:
