services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: enote
      POSTGRES_PASSWORD: enote_password
      POSTGRES_DB: enote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enote"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: enote
      RABBITMQ_DEFAULT_PASS: enote_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=enote;Username=enote;Password=enote_password
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharsLong!
      - Jwt__Issuer=ENote.Api
      - Jwt__Audience=ENote.Client
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=enote
      - RabbitMQ__Password=enote_password
      - Cors__AllowedOrigins__0=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=enote;Username=enote;Password=enote_password
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharsLong!
      - Jwt__Issuer=ENote.Api
      - Jwt__Audience=ENote.Client
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=enote
      - RabbitMQ__Password=enote_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data: