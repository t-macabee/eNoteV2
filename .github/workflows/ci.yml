name: eNote CI

on:
  push:
    branches: [main, master]
    paths:
      - 'eNote/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'eNote/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eNote

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore eNote.sln

      - name: Build
        run: dotnet build eNote.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test eNote.sln --configuration Release --no-build --verbosity normal
